<!DOCTYPE html>
<html>
<head>
    <title>Test Form</title>
    <style>
        body { font-family: Arial; padding: 40px; max-width: 600px; margin: 0 auto; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Test Form for DigitalClerk</h1>
    <form>
        <label>Full Name:</label>
        <input type="text" name="name" placeholder="Enter your name">
        
        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
        
        <label>Phone:</label>
        <input type="tel" name="phone" placeholder="Enter your phone">
        
        <label>Address:</label>
        <textarea name="address" rows="3" placeholder="Enter your address"></textarea>
        
        <button type="submit">Submit</button>
    </form>
</body>
</html>
